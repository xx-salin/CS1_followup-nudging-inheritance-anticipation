<div class="timeline-container">
    <div class="timeline-inner">
        <!-- Horizontal line -->
        <div class="timeline-line"></div>

        <!-- Ticks -->
        <div class="timeline-ticks">
            <div class="tick"></div>
            <div class="tick"></div>
            <div class="tick"></div>
            <div class="tick"></div>
            <div class="tick"></div>
        </div>

        <!-- Years between ticks -->
        <div class="timeline-years">
            <div class="year">Year 1</div>
            <div class="year">Year 2</div>
            <div class="year">Year 3</div>
            <div class="year">Year 4</div>
        </div>

        <!-- Arrow below a tick -->
        <div class="timeline-arrow" style="left: {{ arrow_left_percent }}%;">
            <span class="arrow-symbol">↑</span>
            <span class="arrow-label">{{ payment_label }}</span>
        </div>
    </div>
</div>

<style>
.timeline-container {
    position: relative;
    width: 100%;
    height: 160px;
    margin: 20px 0;
    font-size: 16px;
    font-family: inherit;
    color: black;
    padding-left: 30px;  
    padding-right: 30px;
}

/* Inner wrapper that matches the line width */
.timeline-inner {
    position: relative;
    width: 80%;   /* same as line width */
    margin: 0 auto; /* center the line inside container */
}

/* Horizontal line */
.timeline-line {
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    height: 2px;
    background: black;
}

/* Ticks */
.timeline-ticks {
    display: flex;
    justify-content: space-between;
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
}

.tick {
    width: 2px;
    height: 10px;
    background: black;
}

/* Years between ticks */
.timeline-years {
    display: flex;
    justify-content: space-between;
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
}

.year {
    text-align: center;
    width: 25%;
}

/* Arrow below line */
.timeline-arrow {
    position: absolute;
    top: 70px;
    left: {{ arrow_left_percent }}%;  /* now relative to inner div */
    transform: translateX(-50%);
    text-align: center;
    color: black;
    font-weight: normal;
    max-width: 100px;
}

/* Arrow symbol styling */
.timeline-arrow .arrow-symbol {
    font-size: 24px;
    display: block;
    line-height: 1;
    margin-bottom: 4px;
}

/* Label styling */
.timeline-arrow .arrow-label {
    display: block;
    white-space: normal;
    overflow-wrap: break-word;
    text-align: center;
}
</style>
