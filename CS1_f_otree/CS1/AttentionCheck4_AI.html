{% extends "global/Page.html" %}
{% load otree static %}

{% block title %}
    Bot Check - 2 (of 2)
{% endblock %}



{% block content %}

    <p>
    <img src="{{ static "cafewall.png" }}" style="width: 20vw; height: auto;"/>
    </p>

    <p>
        {% formfields %}
        <br>
    </p>


    <p>
    <!-- .otree-btn-next is the CSS/jQuery selector for this button -->
    <button class="otree-btn-next btn btn-primary">Next</button>
    </p>

{% if testing %}
    <button id="skipBtn" class="btn btn-secondary px-3" type="button" onclick="skipPage()">
        Skip for testing
    </button>
{% endif %}

{% endblock %}
{% block scripts %}
{% if testing %}
<script>
    function skipPage() {
        document.querySelector('input[name="cafewall"][value="2"]').checked = true;
        document.getElementById('form').submit();
    }
</script>
{% endif %}
{% endblock %}
